name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-gate:
    name: Locked offline fixture quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install the locked development environment
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Public repository audit
        run: uv run python scripts/publication_audit.py
      - name: Repository-owned fixture tests and coverage
        run: uv run pytest --cov=envresearch --cov-report=term-missing --cov-fail-under=80
